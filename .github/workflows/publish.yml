name: Build and publish Snap

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to package (for example, v0.29.0-beta)
        required: false
        type: string
      publish:
        description: Publish the built snaps to the Snap Store
        required: true
        default: false
        type: boolean
      channel:
        description: Snap Store channel used when publishing
        required: true
        default: beta
        type: choice
        options:
          - stable
          - candidate
          - beta
          - edge

permissions:
  contents: read

# Queue every run so a pending release is never replaced by a later one.
concurrency:
  group: snap-publish
  queue: max

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      asset_version: ${{ steps.release.outputs.asset_version }}
      channel: ${{ steps.release.outputs.channel }}
      stable: ${{ steps.release.outputs.stable }}

    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="${version}_beta"
            stable=true
            channel="${INPUT_CHANNEL:-beta}"
            if [[ "$EVENT_ACTION" == opentubex-release ]]; then
              channel=beta,edge
            fi
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="$version"
            stable=false
            channel=edge
          else
            echo "Expected a stable or nightly OpenTubeX tag, got: $tag" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset_version=$asset_version"
            echo "channel=$channel"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} Snap
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download OpenTubeX package
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ASSET: opentubex_${{ needs.resolve.outputs.asset_version }}_${{ matrix.arch }}.deb
        run: |
          set -euo pipefail
          wget --quiet --output-document=opentubex.deb \
            "https://github.com/OpenTubeX/OpenTubeX/releases/download/${TAG}/${ASSET}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" snap/snapcraft.yaml

      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Upload Snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentubex-${{ needs.resolve.outputs.version }}-${{ matrix.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  publish:
    name: Publish to the Snap Store
    needs: [resolve, build]
    if: github.event_name == 'repository_dispatch' || inputs.publish
    runs-on: ubuntu-latest

    steps:
      - name: Download Snap packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opentubex-*.snap
          merge-multiple: true

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      # A revision that waits for store review is not released; snapcraft fails then.
      - name: Upload and release
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo "The SNAPCRAFT_STORE_CREDENTIALS repository secret is not configured" >&2
            exit 1
          fi
          for snap in *.snap; do
            snapcraft upload "$snap" --release "$CHANNEL"
          done

  release:
    name: Publish GitHub release
    needs: [resolve, build]
    if: needs.resolve.outputs.stable == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Snap packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opentubex-*.snap
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          snaps=(*.snap)
          if [[ "${#snaps[@]}" -ne 2 ]]; then
            echo "Expected two Snap packages, found ${#snaps[@]}" >&2
            exit 1
          fi

          notes="Snap packages for [OpenTubeX ${TAG}](https://github.com/OpenTubeX/OpenTubeX/releases/tag/${TAG}).

          Install from the [Snap Store](https://snapcraft.io/opentubex) with automatic updates:
          \`\`\`bash
          sudo snap install opentubex --beta
          \`\`\`

          Or install a downloaded package manually:
          \`\`\`bash
          sudo snap install --dangerous ./opentubex_${VERSION}_amd64.snap
          # or for ARM64:
          sudo snap install --dangerous ./opentubex_${VERSION}_arm64.snap
          \`\`\`

          Packages installed this way are not connected to the Snap Store and must be updated manually."

          if release="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" 2>&1)"; then
            if jq --exit-status '.immutable == true' <<< "$release" >/dev/null; then
              for asset in "${snaps[@]}"; do
                if ! jq --exit-status --arg name "$asset" \
                  'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
                  <<< "$release" >/dev/null; then
                  echo "Immutable release $TAG is missing a complete $asset; publish a new tag." >&2
                  exit 1
                fi
              done
              echo "Keeping the published packages in immutable release $TAG."
              exit 0
            fi
            gh release upload "$TAG" "${snaps[@]}" --clobber
            if jq --exit-status '.draft == true' <<< "$release" >/dev/null; then
              gh release edit "$TAG" --draft=false
            fi
          elif [[ "$release" == *"(HTTP 404)"* ]]; then
            gh release create "$TAG" "${snaps[@]}" \
              --title "OpenTubeX ${VERSION} (Snap)" \
              --notes "$notes"
          else
            echo "$release" >&2
            exit 1
          fi
