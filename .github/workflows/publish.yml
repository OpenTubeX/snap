name: Build and publish Snap

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to package (for example, v0.29.0-beta)
        required: false
        type: string
      publish:
        description: Publish the built snaps to the Snap Store
        required: true
        default: false
        type: boolean
      channel:
        description: Snap Store channel used when publishing
        required: true
        default: beta
        type: choice
        options:
          - stable
          - candidate
          - beta
          - edge

permissions:
  contents: read

concurrency:
  group: snap-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} Snap
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="${version}_beta"
            channel="${{ inputs.channel || 'beta' }}"
            if [[ "${{ github.event.action }}" == opentubex-release ]]; then
              channel=beta,edge
            fi
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="$version"
            channel=edge
          else
            echo "Expected a stable or nightly OpenTubeX tag, got: $tag" >&2
            exit 1
          fi

          asset="opentubex_${asset_version}_${TARGET_ARCH}.deb"
          if ! gh release view "$tag" --repo OpenTubeX/OpenTubeX \
            --json assets --jq '.assets[].name' | grep --fixed-strings --line-regexp --quiet "$asset"; then
            echo "Release $tag does not contain $asset" >&2
            exit 1
          fi

          sed -i -E "s/^version:.*/version: ${version}/" snap/snapcraft.yaml
          sed -i -E \
            "s|on amd64: .*|on amd64: https://github.com/OpenTubeX/OpenTubeX/releases/download/${tag}/opentubex_${asset_version}_amd64.deb|" \
            snap/snapcraft.yaml
          sed -i -E \
            "s|on arm64: .*|on arm64: https://github.com/OpenTubeX/OpenTubeX/releases/download/${tag}/opentubex_${asset_version}_arm64.deb|" \
            snap/snapcraft.yaml
          {
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      - name: Upload Snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentubex-${{ steps.release.outputs.version }}-${{ matrix.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Check Snap Store credentials
        if: github.event_name == 'repository_dispatch' || inputs.publish
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo "The SNAPCRAFT_STORE_CREDENTIALS repository secret is not configured" >&2
            exit 1
          fi

      - name: Publish Snap
        if: github.event_name == 'repository_dispatch' || inputs.publish
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP: ${{ steps.snapcraft.outputs.snap }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -o pipefail

          output_file="$(mktemp)"
          if snapcraft upload "$SNAP" --release "$CHANNEL" 2>&1 | tee "$output_file"; then
            exit 0
          fi

          if grep --fixed-strings --quiet \
            "Waiting for previous upload(s) to complete their review process." \
            "$output_file"; then
            echo "::warning::Snap upload is waiting for the previous upload's store review"
            exit 0
          fi

          exit 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Resolve release details
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            version="${BASH_REMATCH[1]}"
            prerelease=false
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            prerelease=true
          else
            echo "Expected a stable or nightly OpenTubeX tag, got: $tag" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Download Snap packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opentubex-*.snap
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          snaps=(*.snap)
          if [[ "${#snaps[@]}" -ne 2 ]]; then
            echo "Expected two Snap packages, found ${#snaps[@]}" >&2
            exit 1
          fi

          notes="Snap packages for [OpenTubeX ${TAG}](https://github.com/OpenTubeX/OpenTubeX/releases/tag/${TAG}).

          Download the package for your architecture and install it with:
          \`\`\`bash
          sudo snap install --dangerous ./opentubex_*.snap
          \`\`\`

          Packages installed this way are not connected to the Snap Store and must be updated manually."

          if [[ "$PRERELEASE" == true ]]; then
            printf -v notes \
              '> [!WARNING]\n> This nightly build is intended for testing only and may be unstable. Regular users should use the [latest non-prerelease](https://github.com/OpenTubeX/snap/releases/latest).\n\n%s' \
              "$notes"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${snaps[@]}" --clobber
          else
            release_flags=()
            if [[ "$PRERELEASE" == true ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$TAG" "${snaps[@]}" \
              --title "OpenTubeX ${VERSION} (Snap)" \
              "${release_flags[@]}" \
              --notes "$notes"
          fi
